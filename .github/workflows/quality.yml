name: Quality gates
on:
  push:
    branches: [main, 'staging/quality-foundation', 'staging/release']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/verify.sh
      - name: Preserve browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: /tmp/relay-*.png
          if-no-files-found: ignore
          retention-days: 3
  promote-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging/quality-foundation'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance staging deployment branch after all gates
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/staging/quality-foundation | cut -f1)
          test "$current" = "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/staging/release"
